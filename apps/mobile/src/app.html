    <title>Orientation Quest</title>
    <script>
      document.documentElement.dataset.shell = /android/i.test(navigator.userAgent)
        ? "android"
        : "ios";
    </script>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: grid;
        place-items: center;
        background: #ffffff;
      }

      #splash svg {
        width: min(42vw, 20vh);
        height: auto;
      }

      html[data-shell="android"] #splash svg > g {
        clip-path: url(#splash-android);
      }

      #splash[data-leaving] {
        opacity: 0;
        transition: opacity 220ms ease-out;
      }

      @media (prefers-reduced-motion: reduce) {
        #splash[data-leaving] {
          transition: none;
        }
      }
    </style>
    %sveltekit.head%
  </head>
