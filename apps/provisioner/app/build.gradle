apply plugin: 'com.android.application'

android {
    namespace 'quest.provisioner'
    compileSdk 36
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'quest.provisioner'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }
}
