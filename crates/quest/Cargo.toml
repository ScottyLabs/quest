[package]
name = "quest"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "quest"

[dependencies]
aes = "0.9.0"
axum = "0.8.9"
axum-oidc = { git = "https://codeberg.org/pfzetto/axum-oidc", rev = "007135e2c26830f6c89d1659302c228076c7afa7" }
base64 = "0.22.1"
cbc = "0.2.0"
chrono = "0.4.42"
cmac = "0.8.0"
csv = "1.4.0"
dotenvy = "0.15.7"
entity = { path = "../entity" }
fred = { version = "10", features = ["unix-sockets"] }
hex = "0.4.3"
hmac = "0.13.0"
migration = { path = "../migration" }
p256 = { version = "0.13.2", features = ["jwk"] }
pkpass = "1.1.0"
rand = "0.9.2"
reqwest = { version = "0.12.28", default-features = false, features = [
  "json",
  "rustls-tls",
] }
sea-orm = { version = "=2.0.0-rc.37", default-features = false, features = [
  "macros",
  "runtime-tokio-rustls",
  "sqlx-postgres",
  "with-chrono",
  "with-json",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
subtle = "2.6.1"
tokio = { version = "1.52.1", features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["cors"] }
tower-sessions = "0.14"
tower-sessions-redis-store = "0.16.0"
utoipa = { version = "5.4.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.2.0"
utoipa-scalar = { version = "0.3.0", features = ["axum"] }
uuid = { version = "1.24.0", features = ["v4"] }
x509-cert = "0.2.5"
