[package]
name = "quest"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "quest"

[dependencies]
aes = "0.9.0"
axum = "0.8.9"
# The git rev tartan-vote pins: the crates.io `1.0.0-dev-2` predates
# `with_state_generator`, and without it the OAuth `state` cannot carry the
# `return_to` that ricochet routes on.
axum-oidc = { git = "https://codeberg.org/pfzetto/axum-oidc", rev = "007135e2c26830f6c89d1659302c228076c7afa7" }
base64 = "0.22.1"
cbc = "0.2.0"
cmac = "0.8.0"
dotenvy = "0.15.7"
entity = { path = "../entity" }
fred = { version = "10", features = ["unix-sockets"] }
hex = "0.4.3"
hmac = "0.13.0"
migration = { path = "../migration" }
rand = "0.9.2"
reqwest = { version = "0.12.28", default-features = false, features = [
  "json",
  "rustls-tls",
] }
sea-orm = { version = "2.0.0-rc.37", default-features = false, features = [
  "macros",
  "runtime-tokio-rustls",
  "sqlx-postgres",
  "with-chrono",
  "with-json",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
subtle = "2.6.1"
tokio = { version = "1.52.1", features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["cors"] }
tower-sessions = "0.14"
tower-sessions-redis-store = "0.16.0"
