<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portal - CMU Orientation Quest</title>
    <style>
      body {
        display: grid;
        min-height: 100dvh;
        margin: 0;
        padding: 2rem;
        background: #f9eff0;
        color: #3f4143;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        place-items: center;
      }

      main {
        max-width: 26rem;
        text-align: center;
      }

      h1 {
        margin: 0 0 0.5rem;
        color: #c41230;
        font-size: 1.5rem;
      }

      p {
        margin: 0;
        line-height: 1.6;
      }

      code {
        padding: 0.1rem 0.3rem;
        border-radius: 4px;
        background: #e2b7b7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Portal not built</h1>
      <p>
        This deploy has no portal bundle. Build <code>apps/portal</code> and point
        <code>QUEST_PORTAL</code> at its <code>build</code> directory.
      </p>
    </main>
  </body>
</html>
