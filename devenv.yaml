secretspec:
  enable: true
  profile: dev

# every androidenv component needs permitting by name
nixpkgs:
  permitted_unfree_packages:
    - androidsdk
    - android-sdk-cmdline-tools
    - android-sdk-build-tools
    - android-sdk-platform-tools
    - android-sdk-platforms
    - android-sdk-tools
    - android-sdk-emulator
    - cmdline-tools
    - build-tools
    - platform-tools
    - platforms
    - tools
    - emulator
    - system-image-36-google_apis_playstore-x86_64
    - system-image-36-google_apis_playstore-arm64-v8a
    - android-sdk-system-image-36-google_apis_playstore-arm64-v8a-system-image-36-google_apis_playstore-x86_64
    - system-image-36-google_apis-x86_64
    - system-image-36-google_apis-arm64-v8a
    - android-sdk-system-image-36-google_apis-arm64-v8a-system-image-36-google_apis-x86_64

inputs:
  nixpkgs:
    url: github:nixos/nixpkgs/nixos-unstable
  scottylabs:
    url: git+https://codeberg.org/ScottyLabs/kennel
    inputs:
      nixpkgs:
        follows: nixpkgs
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
  treefmt-nix:
    url: github:numtide/treefmt-nix
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
