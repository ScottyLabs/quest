[project]
name = "quest"
revision = "1.0"

[providers]
local = "dotenv://.env"
openbao = "openbao://secrets.scottylabs.org/secret"
openbao-ci = "openbao://secrets.scottylabs.org/secret?auth=jwt&role=ci&audience=openbao"

[profiles.default]
AWS_ACCESS_KEY_ID = { description = "sccache S3 access key ID", ref = { item = "shared/sccache", field = "AWS_ACCESS_KEY_ID" } }
AWS_SECRET_ACCESS_KEY = { description = "sccache S3 secret access key", ref = { item = "shared/sccache", field = "AWS_SECRET_ACCESS_KEY" } }
CACHIX_AUTH_TOKEN = { description = "Cachix auth token", ref = { item = "shared/cachix", field = "CACHIX_AUTH_TOKEN" } }
MASTER_KEY = { description = "32-byte SDM master secret, hex-encoded (64 chars)" }
OIDC_CLIENT_ID = { description = "Keycloak OIDC client ID" }
OIDC_CLIENT_SECRET = { description = "Keycloak OIDC client secret" }
KEYCLOAK_URL = { description = "Keycloak base URL" }
KEYCLOAK_REALM = { description = "Keycloak realm" }
OAUTH_RELAY_URL = { description = "OAuth relay callback URL the Keycloak client is registered against" }
PROJECT_ADMIN_GROUP = { description = "Keycloak project admin group path, matched against the `groups` claim" }
CDN_S3_ENDPOINT = { description = "Garage S3 endpoint for the cdn-quest bucket", required = false }
CDN_S3_BUCKET = { description = "Garage bucket holding uploaded portal assets", required = false }
CDN_ACCESS_KEY_ID = { description = "Garage access key ID scoped to the CDN bucket", required = false }
CDN_SECRET_ACCESS_KEY = { description = "Garage secret access key scoped to the CDN bucket", required = false }
CDN_PUBLIC_URL = { description = "Public base URL uploaded assets are served from, with a trailing slash", required = false }
PASS_CERT_PEM = { description = "Apple Pass Type ID certificate, PEM or base64-encoded PEM", required = false }
PASS_KEY_PEM = { description = "Pass Type ID private key, unencrypted PKCS#8 PEM or base64-encoded PEM", required = false }
PASS_TYPE_IDENTIFIER = { description = "Pass type identifier; must match the certificate UID", required = false }
PASS_TEAM_IDENTIFIER = { description = "Apple team identifier; must match the certificate OU", required = false }

[profiles.prod]

[profiles.staging]

[profiles.preview]

[profiles.dev.defaults]
providers = ["openbao"]

[profiles.dev]
HOST = { description = "Backend bind address", default = "0.0.0.0" }
PORT = { description = "Backend listen port", default = "8080" }
VALKEY_URL = { description = "Valkey connection URL backing server-side sessions", default = "redis://127.0.0.1:6379" }

[profiles.ci.defaults]
required = false
providers = ["openbao-ci"]

[profiles.ci]
