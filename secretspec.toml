[project]
name = "quest"
revision = "1.0"

[providers]
local = "dotenv://.env"
vault = "vault://secrets.scottylabs.org/secret"

[profiles.ci.defaults]
required = false

[profiles.default]
MASTER_KEY = { description = "32-byte SDM master secret, hex-encoded (64 chars)", required = true, providers = [
  "vault",
] }
OIDC_CLIENT_ID = { description = "Keycloak OIDC client ID", required = true, providers = [
  "vault",
] }
OIDC_CLIENT_SECRET = { description = "Keycloak OIDC client secret", required = true, providers = [
  "vault",
] }
KEYCLOAK_URL = { description = "Keycloak base URL", required = true, providers = [
  "vault",
] }
KEYCLOAK_REALM = { description = "Keycloak realm", required = true, providers = [
  "vault",
] }
OAUTH_RELAY_URL = { description = "OAuth relay callback URL the Keycloak client is registered against", required = true, providers = [
  "vault",
] }
PROJECT_ADMIN_GROUP = { description = "Keycloak project admin group path, matched against the `groups` claim", required = true, providers = [
  "vault",
] }

[profiles.prod]

[profiles.staging]

[profiles.preview]

[profiles.dev.defaults]
providers = ["vault"]

[profiles.dev]
HOST = { description = "Backend bind address", default = "0.0.0.0" }
PORT = { description = "Backend listen port", default = "8080" }
VALKEY_URL = { description = "Valkey connection URL backing server-side sessions", default = "redis://127.0.0.1:6379" }
